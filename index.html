;border-top:1px solid rgba(216,184,110,.13);padding-top:15px;color:#9f88a8}summary{text-align:center;font-size:12px;letter-spacing:.12em;cursor:pointer;list-style:none}.advanced{display:grid;gap:9px;padding-top:14px}.mini{width:100%;padding:10px 12px;border:1px solid rgba(216,184,110,.18);border-radius:10px;background:rgba(4,2,7,.35);color:#eee0cb;outline:none}.posgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.head{text-align:center;padding:5vh 0 3vh}.head h2{font-size:34px;margin:10px 0}.echo{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:7px 13px;border:1px solid rgba(216,184,110,.13);border-radius:99px;color:#c7b3cc;font-size:12px}.deck{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px 0 20px;perspective:800px}.pick{position:relative;border:0;background:none;padding:0;aspect-ratio:929/1692;cursor:pointer;filter:drop-shadow(0 5px 5px #000);transition:.25s;animation:deal .45s both}.pick:nth-child(3n){transform:translateY(5px) rotate(1.5deg)}.pick:nth-child(3n+1){transform:translateY(-2px) rotate(-1.4deg)}.pick img{width:100%;height:100%;object-fit:cover;border-radius:7px;border:1px solid var(--line)}.pick:hover{z-index:2;transform:translateY(-9px) scale(1.07)}.pick.chosen{opacity:.12;pointer-events:none}@keyframes deal{from{opacity:0;transform:translateY(22px)}}.bar{position:sticky;bottom:12px;display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:18px;background:rgba(18,7,25,.92);backdrop-filter:blur(16px);box-shadow:0 16px 40px #030104}.bar div{flex:1}.bar b{font-size:20px;color:var(--gold)}.bar span{font-size:11px;color:#a58fac}.bar .primary{width:auto;margin:0;padding:12px 18px}.reading{display:grid;gap:28px}.item{display:grid;grid-template-columns:minmax(125px,42%) 1fr;gap:17px;align-items:center}.card{width:100%;aspect-ratio:929/1692;border:0;background:none;padding:0;perspective:1000px;cursor:pointer}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1)}.shown .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;overflow:hidden;border-radius:12px;backface-visibility:hidden;border:1px solid var(--line);box-shadow:0 16px 35px #030104}.face img{width:100%;height:100%;object-fit:cover}.front{transform:rotateY(180deg)}.front img.rev{transform:rotate(180deg)}.meaning{opacity:.25;filter:blur(5px);transition:.55s}.shown+.meaning{opacity:1;filter:none}.slot{font-size:10px;letter-spacing:.17em;color:#a98db3}.meaning h3{font-size:27px;margin:5px 0 1px}.ori{font-size:11px;color:var(--gold)}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.tags i{font-style:normal;font-size:10px;border:1px solid rgba(216,184,110,.17);border-radius:99px;padding:3px 7px;color:#cbb8d0}.meaning p{font-size:13px;line-height:1.75;color:#c8b6ca;margin:0}.wait{color:#806b88!important}.actions{padding:25px 0}.closing{text-align:center;padding:21px;border:1px solid rgba(216,184,110,.17);border-radius:19px;background:rgba(50,20,58,.38)}.closing b{font:24px "STKaiti","KaiTi";color:var(--gold)}.closing p{font-size:12px;color:#a891af}.exportrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}.exportrow button{letter-spacing:.05em;font-size:13px}.toast{text-align:center;color:var(--gold);font-size:12px;min-height:18px;margin:7px 0}.hide{display:none}@media(max-width:430px){.deck{grid-template-columns:repeat(5,1fr);gap:7px}.posgrid{grid-template-columns:1fr}.item{gap:13px}.meaning h3{font-size:23px}.meaning p{font-size:12px}.bar .primary{font-size:11px}}

const BASE=[{"id":0,"en":"THE FOOL","zh":"愚人","image":"00-the-fool.png","keywords":["启程","天真","可能性"],"upright":"带着信任迈向未知。此刻不必拥有完整答案，重要的是允许新的经验发生。","reversed":"冲动可能遮住脚下的路。先确认风险，再决定这一步是否真的出于自由。"},{"id":1,"en":"THE MAGICIAN","zh":"魔术师","image":"01-the-magician.png","keywords":["创造","意志","显化"],"upright":"你已经拥有把想法变成现实的工具。专注地使用它们，事情便会开始成形。","reversed":"能力没有消失，只是力量被分散或误用。留意承诺与行动是否一致。"},{"id":2,"en":"THE HIGH PRIESTESS","zh":"女祭司","image":"02-the-high-priestess.png","keywords":["直觉","静默","隐秘"],"upright":"答案藏在安静之中。暂缓判断，倾听梦境、身体与那一闪而过的直觉。","reversed":"你可能忽略了内心早已知道的事，或被秘密与猜测困住。回到可验证的感受。"},{"id":3,"en":"THE EMPRESS","zh":"皇后","image":"03-the-empress.png","keywords":["丰盛","滋养","生长"],"upright":"给予时间、照顾与感官上的满足，关系或计划正在肥沃的土壤里成长。","reversed":"过度付出会让滋养变成耗竭。先照顾自己，也给成长留出呼吸的空间。"},{"id":4,"en":"THE EMPEROR","zh":"皇帝","image":"04-the-emperor.png","keywords":["秩序","边界","掌控"],"upright":"建立清晰规则与可靠结构。稳定并不冷酷，它让重要的事能够长久。","reversed":"控制可能过紧，也可能缺少主心骨。重新定义权力、责任与边界。"},{"id":5,"en":"THE HIEROPHANT","zh":"教皇","image":"05-the-hierophant.png","keywords":["传统","学习","信念"],"upright":"向成熟的体系或导师学习，在传统里找到能支撑你的智慧。","reversed":"旧规则未必仍适合你。理解它的来处，然后有意识地选择遵循或离开。"},{"id":6,"en":"THE LOVERS","zh":"恋人","image":"06-the-lovers.png","keywords":["联结","选择","契合"],"upright":"真正的靠近来自坦诚选择。让价值观，而不只是欲望，决定你与谁同行。","reversed":"关系或内在价值出现错位。别急着修补表面，先说清真正想要什么。"},{"id":7,"en":"THE CHARIOT","zh":"战车","image":"07-the-chariot.png","keywords":["前进","自律","胜利"],"upright":"方向已经明确，用意志协调拉扯你的不同力量，坚定地向目标推进。","reversed":"速度失去方向便会成为消耗。先收回缰绳，再判断这是不是你的终点。"},{"id":8,"en":"STRENGTH","zh":"力量","image":"08-strength.png","keywords":["勇气","温柔","耐心"],"upright":"真正的力量不必咆哮。以耐心和温柔驯服恐惧，你比想象中更有韧性。","reversed":"自我怀疑正在放大不安。无需强迫自己勇敢，先承认脆弱也属于力量。"},{"id":9,"en":"THE HERMIT","zh":"隐士","image":"09-the-hermit.png","keywords":["独处","寻找","内省"],"upright":"暂时离开喧闹，提灯向内寻找。独处不是退缩，而是校准方向。","reversed":"孤独可能变成封闭，或外界声音让你无法独处。试着建立温和的边界。"},{"id":10,"en":"WHEEL OF FORTUNE","zh":"命运之轮","image":"10-wheel-of-fortune.png","keywords":["转折","周期","机缘"],"upright":"局势正在转动。抓住变化带来的窗口，也接受有些力量不由你控制。","reversed":"重复的模式再次出现。与其抗拒变化，不如看清自己能改变其中哪一环。"},{"id":11,"en":"JUSTICE","zh":"正义","image":"11-justice.png","keywords":["真相","因果","决定"],"upright":"诚实面对事实与后果。一个公平的决定，需要清醒而不偏袒自己的目光。","reversed":"信息可能失衡，或有人在回避责任。暂缓定论，检查标准是否前后一致。"},{"id":12,"en":"THE HANGED MAN","zh":"倒吊人","image":"12-the-hanged-man.png","keywords":["暂停","换位","臣服"],"upright":"主动停下来，世界会呈现另一种角度。此刻的悬置正在交换新的领悟。","reversed":"等待若没有觉察，就只是停滞。分辨你是在耐心酝酿，还是害怕做决定。"},{"id":13,"en":"DEATH","zh":"死神","image":"13-death.png","keywords":["结束","蜕变","更新"],"upright":"一个阶段必须结束，新的生命才有空间出现。允许告别，不必把结束理解为失败。","reversed":"你可能抓住已经结束的事不放。转变虽令人不安，却正邀请你卸下旧壳。"},{"id":14,"en":"TEMPERANCE","zh":"节制","image":"14-temperance.png","keywords":["调和","疗愈","分寸"],"upright":"让看似相反的部分慢慢融合。温和、持续的调整会带来比极端更深的改变。","reversed":"生活的配比正在失衡。减少过量之物，也别让克制变成对自己的惩罚。"},{"id":15,"en":"THE DEVIL","zh":"恶魔","image":"15-the-devil.png","keywords":["欲望","束缚","阴影"],"upright":"看见诱惑、依赖与自我欺骗如何拴住你。锁链真实存在，但钥匙也在你手中。","reversed":"你开始识别并松开束缚。保持诚实，别用另一种执念替换旧的执念。"},{"id":16,"en":"TOWER","zh":"高塔","image":"16-the-tower.png","keywords":["突变","揭示","崩解"],"upright":"不稳固的结构被真相击中。混乱会疼痛，却也让你终于看见真实天空。","reversed":"变化可能被延迟或压在心里。小心维护裂缝，往往比重建消耗更多。"},{"id":17,"en":"THE STAR","zh":"星星","image":"17-the-star.png","keywords":["希望","灵感","净化"],"upright":"风暴之后，希望安静地重新亮起。让真实的自己被看见，也相信疗愈正在发生。","reversed":"希望暂时变得遥远。不要强迫乐观，从一件微小而确定的好事重新连接。"},{"id":18,"en":"THE MOON","zh":"月亮","image":"18-the-moon.png","keywords":["迷雾","梦境","潜意识"],"upright":"前路被月光改变了形状。允许不确定，同时留意恐惧投下的影子。","reversed":"迷雾正在散去，或焦虑让幻象更加逼真。慢一点，让事实与感受重新分开。"},{"id":19,"en":"THE SUN","zh":"太阳","image":"19-the-sun.png","keywords":["喜悦","清晰","生命力"],"upright":"事情走向明朗。坦率表达、尽情创造，你的生命力也会照亮身边的人。","reversed":"快乐并未消失，只是被疲惫或过高期待遮住。允许幸福以不完美的方式到来。"},{"id":20,"en":"JUDGEMENT","zh":"审判","image":"20-judgement.png","keywords":["觉醒","召唤","复盘"],"upright":"过去发出召唤，不是为了定罪，而是让你看清自己已经成为谁，并作出回应。","reversed":"自我批判盖过了真正的召唤。放下羞耻，诚实复盘，然后给自己一次新选择。"},{"id":21,"en":"THE WORLD","zh":"世界","image":"21-the-world.png","keywords":["完成","整合","圆满"],"upright":"一个循环完整闭合。庆祝走过的路，把收获整合进身体，再准备下一次启程。","reversed":"最后一块拼图仍未归位。回看尚未完成的承诺，不必因接近终点而仓促。"}];const defaults={1:['此刻的指引'],2:['我所知道的','我尚未看见的'],3:['过去的影响','当下的核心','未来的走向'],4:['现状','阻碍','建议','发展'],5:['起因','现在','隐藏因素','建议','结果'],6:['过去','现在','未来','内在','外在','指引'],7:['此刻的我','真正所求','旧有影响','当前挑战','隐藏力量','行动建议','可能走向']};const st={q:'',n:3,name:'',pos:[...defaults[3]],deck:[],sel:[],shown:0};const A=document.getElementById('app');const E=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function all(){let o={};try{o=JSON.parse(localStorage.getItem('eggplant-tarot-card-overrides')||'{}')}catch(e){}return BASE.map(c=>Object.assign({},c,o[c.id]||{}))}function mix(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function shell(step,body){A.innerHTML='<header class="top"><a href="#" class="brand" id="home"><span class="mark">✦</span><span><b>茄子塔罗</b><small>EGGPLANT TAROT</small></span></a><a href="/admin/" class="admin" aria-label="牌义管理">☾</a></header><div class="steps"><i class="'+(step>0?'on':'')+'"></i><i class="'+(step>1?'on':'')+'"></i><i class="'+(step>2?'on':'')+'"></i></div>'+body;document.getElementById('home').onclick=e=>{e.preventDefault();setup()}}function setup(){shell(1,'<section class="view"><div class="hero"><div class="moon">☾</div><span class="eyebrow">A PRIVATE ORACLE</span><h1>把问题交给牌，<br><em>让命运轻声回答。</em></h1><p>慢慢呼吸，在心里想着你真正想知道的事。</p></div><div class="panel"><label>你想问什么？</label><textarea id="q" class="question" maxlength="160" placeholder="例如：这段关系正在教会我什么？">'+E(st.q)+'</textarea><div class="ct">选择这次抽取的牌数</div><div class="counts">'+[1,2,3,4,5,6,7].map(n=>'<button class="count '+(st.n===n?'active':'')+'" data-n="'+n+'">'+n+'</button>').join('')+'</div><details><summary>✦ 高级牌阵设置</summary><div class="advanced"><input id="spreadname" class="mini" value="'+E(st.name)+'" placeholder="牌阵名称（选填）"><div class="posgrid">'+st.pos.map((p,i)=>'<input class="mini pos" data-i="'+i+'" value="'+E(p)+'">').join('')+'</div></div></details><button id="go" class="primary">开始占卜</button><div class="err" id="err"></div></div></section>');document.getElementById('q').oninput=e=>st.q=e.target.value;document.querySelectorAll('.count').forEach(b=>b.onclick=()=>{st.n=+b.dataset.n;st.pos=[...defaults[st.n]];setup()});document.getElementById('spreadname').oninput=e=>st.name=e.target.value;document.querySelectorAll('.pos').forEach(x=>x.oninput=e=>st.pos[+e.target.dataset.i]=e.target.value);document.getElementById('go').onclick=start}function start(){st.q=st.q.trim();if(!st.q){document.getElementById('err').textContent='先写下你真正想问的事。';document.getElementById('q').focus();return}st.deck=mix(all());st.sel=[];st.shown=0;select();scrollTo({top:0,behavior:'smooth'})}function select(){shell(2,'<section class="view"><div class="head"><span class="eyebrow">CHOOSE WITH INTUITION</span><h2>凭直觉，选出 '+st.n+' 张牌</h2><p><span class="echo">'+E(st.q)+'</span><br>不用寻找“正确”的牌，停在吸引你的那一张。</p></div><div class="deck">'+st.deck.map((c,i)=>'<button class="pick '+(st.sel.some(x=>x.i===i)?'chosen':'')+'" data-i="'+i+'" style="animation-delay:'+(i*.018)+'s"><img src="/card-back.webp" alt="牌背"></button>').join('')+'</div><div class="bar"><div><b>'+st.sel.length+'</b> / '+st.n+'<br><span>'+(st.sel.length===st.n?'牌已回应你的选择':'还需选择 '+(st.n-st.sel.length)+' 张')+'</span></div><button id="open" class="primary" '+(st.sel.length===st.n?'':'disabled')+'>进入揭示</button></div></section>');document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>pick(+b.dataset.i));document.getElementById('open').onclick=()=>{if(st.sel[0]){let pre=new Image;pre.src=cardURL(st.sel[0].card)}result();scrollTo({top:0,behavior:'smooth'})}}function pick(i){if(st.sel.length>=st.n||st.sel.some(x=>x.i===i))return;st.sel.push({i,card:st.deck[i],rev:Math.random()<.5});select();if(navigator.vibrate)navigator.vibrate(18)}function result(){let done=st.shown===st.sel.length;shell(3,'<section class="view"><div class="head"><span class="eyebrow">THE CARDS HAVE SPOKEN</span><h2>'+E(st.name||'你的牌面回应')+'</h2><p><span class="echo">'+E(st.q)+'</span></p></div><div class="reading">'+st.sel.map(item).join('')+'</div>'+(done?'<div class="closing"><b>故事已经完整显现</b><p>牌不是命令，而是一面镜子。带走真正触动你的部分。</p></div>':'')+'<div class="actions">'+(done?'<div class="exportrow"><button class="primary" id="savepic">保存结果长图</button><button class="secondary" id="copytext">复制文字解读</button></div><div class="toast" id="toast"></div><button class="secondary" id="again">重新占卜</button>':'<button class="primary" id="next">揭示下一张</button>')+'</div></section>');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{if(+b.dataset.i===st.shown)nextCard()});if(done){document.getElementById('again').onclick=setup;document.getElementById('savepic').onclick=savePicture;document.getElementById('copytext').onclick=copyText}else document.getElementById('next').onclick=nextCard}function item(x,i){let c=x.card,on=i<st.shown,ori=x.rev?'逆位':'正位',txt=x.rev?c.reversed:c.upright;return '<article class="item"><button class="card '+(on?'shown':'')+'" data-i="'+i+'"><span class="inner"><span class="face"><img src="/card-back.webp" alt="牌背"></span><span class="face front">'+(on?'<img class="'+(x.rev?'rev':'')+'" src="'+cardURL(c)+'" alt="'+E(c.zh)+'">':'')+'</span></span></button><div class="meaning"><span class="slot">'+E(st.pos[i]||('第 '+(i+1)+' 张'))+'</span>'+(on?'<h3>'+E(c.zh)+'</h3><span class="ori">'+ori+' · '+E(c.en)+'</span><div class="tags">'+c.keywords.map(k=>'<i>'+E(k)+'</i>').join('')+'</div><p>'+E(txt)+'</p>':'<p class="wait">牌面尚未揭示。<br>触碰牌背，让它转身。</p>')+'</div></article>'}async function nextCard(){if(st.shown<st.sel.length){let upcoming=st.sel[st.shown];try{await loadImage(cardURL(upcoming.card))}catch(e){}st.shown++;result();if(navigator.vibrate)navigator.vibrate([18,35,18]);setTimeout(()=>document.querySelectorAll('.item')[st.shown-1]?.scrollIntoView({behavior:'smooth',block:'center'}),80)}}
function textResult(){let lines=['茄子塔罗','问题：'+st.q,''];st.sel.forEach((x,i)=>{let c=x.card,o=x.rev?'逆位':'正位',t=x.rev?c.reversed:c.upright;lines.push((i+1)+'. '+(st.pos[i]||'第 '+(i+1)+' 张')+'｜'+c.zh+'（'+o+'）',c.keywords.join(' · '),t,'')});lines.push('牌不是命令，而是一面镜子。');return lines.join('\n')}
async function copyText(){let msg='文字解读已复制，可以直接发送。';try{await navigator.clipboard.writeText(textResult())}catch(e){let t=document.createElement('textarea');t.value=textResult();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}document.getElementById('toast').textContent=msg}
function cardURL(c){return '/major-arcana/'+c.image.replace(/\.png$/i,'.webp')}function loadImage(src){return new Promise((ok,no)=>{let im=new Image;im.onload=()=>ok(im);im.onerror=no;im.src=src})}
function wrap(c,text,x,y,max,line){let row='',rows=[];for(let ch of [...text]){if(c.measureText(row+ch).width>max&&row){rows.push(row);row=ch}else row+=ch}if(row)rows.push(row);rows.forEach((r,i)=>c.fillText(r,x,y+i*line));return y+rows.length*line}
async function savePicture(){let btn=document.getElementById('savepic'),toast=document.getElementById('toast');btn.disabled=true;btn.textContent='正在生成…';try{let W=1080,M=76,CW=210,CH=382,B=470,H=430+st.sel.length*B+150,cv=document.createElement('canvas');cv.width=W;cv.height=H;let c=cv.getContext('2d'),g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#12081b');g.addColorStop(.55,'#2b1235');g.addColorStop(1,'#0c0711');c.fillStyle=g;c.fillRect(0,0,W,H);c.strokeStyle='rgba(216,184,110,.5)';c.lineWidth=3;c.strokeRect(28,28,W-56,H-56);c.textAlign='center';c.fillStyle='#d8b86e';c.font='34px Georgia';c.fillText('✦  EGGPLANT TAROT  ✦',W/2,100);c.fillStyle='#f6e9d1';c.font='52px KaiTi,serif';c.fillText(st.name||'你的牌面回应',W/2,174);c.fillStyle='#cbb8d0';c.font='28px STSong,serif';wrap(c,'问题：'+st.q,W/2,230,W-180,42);c.textAlign='left';for(let i=0;i<st.sel.length;i++){let x=st.sel[i],card=x.card,y=360+i*B,im=await loadImage(cardURL(card));c.save();if(x.rev){c.translate(M+CW/2,y+CH/2);c.rotate(Math.PI);c.drawImage(im,-CW/2,-CH/2,CW,CH)}else c.drawImage(im,M,y,CW,CH);c.restore();let tx=M+CW+42;c.fillStyle='#a98db3';c.font='22px STSong,serif';c.fillText(st.pos[i]||('第 '+(i+1)+' 张'),tx,y+34);c.fillStyle='#f6e9d1';c.font='42px KaiTi,serif';c.fillText(card.zh,tx,y+88);c.fillStyle='#d8b86e';c.font='21px Georgia';c.fillText((x.rev?'逆位':'正位')+' · '+card.en,tx,y+124);c.fillStyle='#cbb8d0';c.font='23px STSong,serif';c.fillText(card.keywords.join(' · '),tx,y+165);c.fillStyle='#d7c8d8';c.font='25px STSong,serif';wrap(c,x.rev?card.reversed:card.upright,tx,y+213,W-tx-M,38)}c.textAlign='center';c.fillStyle='#9f88a8';c.font='22px STSong,serif';c.fillText('牌不是命令，而是一面镜子。',W/2,H-72);cv.toBlob(blob=>{let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='茄子塔罗-'+new Date().toISOString().slice(0,10)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast.textContent='结果长图已生成，请在下载中查看。';btn.disabled=false;btn.textContent='保存结果长图'},'image/png')}catch(e){toast.tex
