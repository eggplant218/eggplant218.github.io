name: Deploy Eggplant Tarot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download website
        uses: actions/checkout@v4

      - name: Create lightweight mobile card images
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
          cwebp -quiet -q 68 -resize 420 0 card-back.png -o card-back.webp
          for card in major-arcana/*.png; do
            cwebp -quiet -q 68 -resize 420 0 "$card" -o "${card%.png}.webp"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
